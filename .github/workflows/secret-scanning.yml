name: Secret Scanning (Gitleaks)

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz
          ./gitleaks version

      - name: Scan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${PR_BASE_SHA:-}"
            if [[ -z "${BASE_SHA}" ]]; then
              echo "Pull request base SHA is unavailable; skipping scan."
              exit 0
            fi
            RANGE="${BASE_SHA}..HEAD"
          elif [[ "${EVENT_BEFORE:-}" != "" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${EVENT_BEFORE}..HEAD"
          else
            echo "No prior state to diff against; skipping scan."
            exit 0
          fi

          echo "Scanning commits: ${RANGE}"
          # --redact masks secret values in the log output; the CI log never
          # exposes the secret itself, only which rule/file/commit matched.
          set +e
          ./gitleaks detect --source . --redact --verbose \
            --log-opts="${RANGE}" --report-format=json --report-path=gitleaks-report.json
          EXIT_CODE=$?
          set -e

          if [[ -f gitleaks-report.json ]]; then
            COUNT="$(grep -c '"RuleID"' gitleaks-report.json || true)"
            echo "Leaks found: ${COUNT:-0}"
            if [[ "${EXIT_CODE}" -ne 0 ]]; then
              echo "::error::Newly introduced secrets detected. Review the findings."
              exit 1
            fi
          fi

          # No findings (gitleaks returns 0) is success.
          exit "${EXIT_CODE}"
