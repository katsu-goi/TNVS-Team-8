server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: facilities-management-service
  profiles:
    # `dev` is the zero-configuration profile: it needs no external database and
    # no environment variables, so a fresh clone boots green with one command.
    # Every deployed environment sets SPRING_PROFILES_ACTIVE explicitly
    # (`supabase` in the cloud, `local` against a developer Postgres).
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Primary PostgreSQL Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facilities_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FacilitiesHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
        generate_statistics: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@photonicomega.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Cache (Caffeine)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=3600s

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
      file-size-threshold: 2KB

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'

# Application-specific settings
app:
  name: "Photonic Omega Facilities Management System"
  version: "1.0.0"
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  # JWT Settings
  jwt:
    # Never commit a real signing secret. Override JWT_SECRET in every
    # non-local environment (must be at least 256 bits for HS256).
    secret: ${JWT_SECRET:CHANGE-ME-IN-PRODUCTION-PhotonicOmega-2026-jwt-signing-secret-placeholder}
    access-token-expiration: ${JWT_ACCESS_EXPIRY:900000}        # 15 minutes in ms
    refresh-token-expiration: ${JWT_REFRESH_EXPIRY:604800000}   # 7 days in ms
    issuer: photonic-omega-facilities

  # File Storage - Primary (Enterprise File Server)
  storage:
    primary:
      type: local
      path: ${FILE_STORAGE_PATH:/mnt/fileserver/facilities}
      base-url: ${FILE_STORAGE_URL:http://localhost:8080/api/files}
    # Used only when the primary path cannot be written to (e.g. a dev
    # machine with no /mnt/fileserver mount). Upload logs a warning and
    # keeps working instead of failing.
    fallback:
      path: ${FILE_STORAGE_FALLBACK_PATH:${java.io.tmpdir}/facilities-documents}
    backup:
      type: supabase
      url: ${SUPABASE_URL:https://your-project.supabase.co}
      key: ${SUPABASE_SERVICE_KEY:your-service-key}
      bucket: ${SUPABASE_BUCKET:facilities-documents}

  # Backup & Disaster Recovery - directory where real database dumps are written
  backup:
    storage-path: ${BACKUP_STORAGE_PATH:${java.io.tmpdir}/facilities-backups}

  # Supabase Realtime (live user activity / online users)
  supabase:
    url: ${SUPABASE_URL:https://your-project.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:}
    activity-table: ${SUPABASE_ACTIVITY_TABLE:user_activity_events}
    online-table: ${SUPABASE_ONLINE_TABLE:online_users}

  # AI Services
  ai:
    enabled: ${AI_ENABLED:true}
    # Master key for AES-256-GCM encryption of AI provider API keys before they
    # are persisted (ai_providers.encrypted_api_key). Must be a base64-encoded
    # 256-bit key. NEVER hardcode: supply AI_API_KEY_ENCRYPTION_KEY in every
    # non-local environment. ApiKeyEncryptionService fails fast when unset.
    encryption-key: ${AI_API_KEY_ENCRYPTION_KEY:}
    llama:
      base-url: ${LLAMA_API_URL:http://ollama:11434}
      model: ${LLAMA_MODEL:llama3.3}
      timeout: 120000
    qwen:
      base-url: ${QWEN_API_URL:http://ollama:11434}
      model: ${QWEN_MODEL:qwen2.5}
      timeout: 120000
    embedding:
      model: ${EMBEDDING_MODEL:nomic-embed-text}
      dimension: 768

  # CORS
  cors:
    # Treated as origin *patterns* (see SecurityConfig), so the localhost
    # entries cover whichever port Vite lands on - it auto-increments to
    # 5174, 5175, ... when an earlier dev server is still running, and a
    # non-listed origin is rejected with "403 Invalid CORS request" before
    # the request ever reaches the login handler.
    # Override with the CORS_ORIGINS env var in non-local environments.
    allowed-origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # Scheduler
  scheduler:
    retention-check-cron: "0 0 2 * * ?"       # 2 AM daily
    contract-expiry-cron: "0 0 8 * * ?"        # 8 AM daily
    visitor-cleanup-cron: "0 0 1 * * ?"        # 1 AM daily

  # Geographic IP Threat Map - IP geolocation provider (fail-open, Caffeine cached).
  # Lookups that fail (timeout/rate-limit/private IP) resolve to "unknown" and
  # never block security event processing.
  geo:
    provider: ${GEO_PROVIDER:ip-api}
    base-url: ${GEO_BASE_URL:http://ip-api.com/json}
    timeout-ms: ${GEO_TIMEOUT_MS:2000}
    cache-ttl-seconds: ${GEO_CACHE_TTL_SECONDS:86400}
    cache-max-size: ${GEO_CACHE_MAX_SIZE:10000}

  # Security
  security:
    bcrypt-strength: 12
    password-reset-expiry-minutes: 30
    # Progressive login lockout. Attempt counters and lock windows are stored
    # server-side (users table) and enforced before password verification, so
    # the lock cannot be bypassed from the client. lock-duration-seconds is
    # indexed by failed-attempt number (1st -> 10s, 2nd -> 30s); the final
    # attempt triggers the permanent lock below.
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:3}
      lock-duration-seconds: ${LOGIN_LOCK_DURATIONS:10,30}
      permanent-lock-duration-days: ${LOGIN_PERMANENT_LOCK_DAYS:365}
      # Optionally notify this mailbox on HR assistance submissions.
  hr:
    contact-email: ${HR_CONTACT_EMAIL:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    disable-swagger-default-url: true
  info:
    title: Facilities Management API
    version: 1.0.0
    description: AI-Powered Facilities & Administrative Management System API

# Logging
logging:
  level:
    root: INFO
    com.photonicomega: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/facilities-management.log
    max-size: 100MB
    max-history: 30

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:facilities_db}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # Same reason as the dev profile below: this is H2, and inheriting the root
        # document's PostgreSQLDialect makes the suite exercise a dialect no H2 profile
        # actually runs on. `create-drop` means the migration defect that motivated the
        # dev pin cannot bite here, but a suite that validates DDL under one dialect
        # while a developer boots under another is the same shape of gap that let the
        # missing dev encryption key survive 146 green tests.
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  security:
    bcrypt-strength: 4
  ai:
    # TEST-ONLY encryption key for the H2-backed test profile. Never used in any
    # non-test profile; production keys come exclusively from AI_API_KEY_ENCRYPTION_KEY.
    encryption-key: u7C3tz495/FDo8wghmVAvVZKBPzWFIlejhyXfGa06qg=

---
# Zero-configuration developer profile. File-backed H2 in PostgreSQL
# compatibility mode, so the schema comes from the entity model and the data
# survives a restart - unlike the `test` profile, which is create-drop and is
# wiped every boot. Requires no local Postgres and no credentials.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/facilities-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # H2, not PostgreSQL. The root document forces PostgreSQLDialect for the real
        # Postgres profiles, and inheriting it here left Hibernate migrating an H2 file
        # while believing it was talking to Postgres. `ddl-auto: update` then read the
        # existing schema through the wrong dialect: it re-issued constraints and
        # indexes that were already there (the "already exists" warnings every boot)
        # and, worse, did not notice columns the entity model had gained. A dev
        # database created before DisposalRequest grew approval_request_id,
        # requested_by_id and requested_by_email never received them, and
        # GET /v1/compliance/alerts, GET /v1/compliance/disposals and the gated
        # POST /v1/compliance/documents/{id}/disposal answered 500 with
        # "An unexpected error occurred" - a schema fault presented as a server crash.
        # Only the H2 profiles were affected; the deployed profiles run real Postgres,
        # where the forced dialect is correct.
        #
        # Hibernate logs HHH90000025 here - "H2Dialect does not need to be specified
        # explicitly" - and it is wrong about this file. Auto-detection would indeed
        # pick H2Dialect, but only in the absence of an explicit setting, and the root
        # document supplies one. Removing this line to silence that warning restores
        # the bug. HibernateDialectConfigTest asserts it stays.
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  security:
    bcrypt-strength: 6
  ai:
    # DEV-ONLY encryption key, published on purpose so the claim above - no external
    # database, no environment variables - is actually true. Without it the root
    # default ${AI_API_KEY_ENCRYPTION_KEY:} resolves to blank,
    # ApiKeyEncryptionService fails fast as designed, and the context never refreshes:
    # `mvnw spring-boot:run` died on a fresh clone and took every route with it, while
    # the test suite stayed green because the `test` profile has always carried its own
    # key. ApiKeyEncryptionConfigTest boots this profile to keep that from recurring.
    # This value is refused outside the dev and test profiles (PUBLISHED_KEYS), so
    # copying it into a deployment fails at startup rather than silently encrypting
    # every provider key with something anyone can read. An env var still wins here,
    # for a developer who wants a key of their own.
    encryption-key: ${AI_API_KEY_ENCRYPTION_KEY:0tJRq8HSlEH5Ddjv5Y+bjObw/AWl9DTY0yjyoFiNrYw=}

---
spring:
  config:
    activate:
      on-profile: supabase
  # Production cloud database. Never commit credentials - supply them via
  # SUPABASE_DB_URL / SUPABASE_DB_USERNAME / SUPABASE_DB_PASSWORD. The default
  # URL/username match the production Supabase project ref dunijfrvfozwlykpkfhy
  # (pooler host aws-0-ap-southeast-1.pooler.supabase.com:6543, transaction pooler).
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0}
    username: ${SUPABASE_DB_USERNAME:postgres.dunijfrvfozwlykpkfhy}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/facilities_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
